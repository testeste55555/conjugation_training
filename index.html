<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>かつよう フラッシュカード</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body data-mode="classroom">

<div class="app">
  <header>
    <div>
      <h1>かつよう フラッシュカード</h1>
      <div class="sub">じゅぎょうモード</div>
    </div>
    <div class="score personal-only" hidden aria-live="polite">
      <div class="pill">できた <b id="okCount">0</b></div>
      <div class="pill">もういちど <b id="againCount">0</b></div>
    </div>
  </header>

  <nav class="page-nav" aria-label="ページ">
    <button class="tab active" id="practicePageBtn" aria-pressed="true">れんしゅう</button>
    <button class="tab" id="rulesPageBtn" aria-pressed="false">かつようの ルール</button>
  </nav>

  <div id="practicePage">
    <section class="panel" aria-label="ことばのしゅるい">
      <p class="label">1　ことばを えらぶ</p>
      <div class="tabs" id="typeTabs"></div>
    </section>

    <section class="panel" aria-label="かたち">
      <p class="label">2　れんしゅうする かたちを えらぶ</p>
      <div class="chips" id="formChips"></div>
    </section>

    <section class="panel" aria-label="にんずう">
      <p class="label">3　にんずう</p>
      <div class="settings-row">
        <div class="class-size-control">
          <button class="smallbtn" id="sizeMinus" aria-label="にんずうを へらす">−</button>
          <input id="classSizeInput" type="number" min="1" max="50" step="1" value="10" inputmode="numeric" aria-label="にんずう" />
          <span>にん</span>
          <button class="smallbtn" id="sizePlus" aria-label="にんずうを ふやす">＋</button>
        </div>
      </div>
      <div class="start-row">
        <button class="bigbtn next" id="startBtn">れんしゅうを はじめる</button>
        <span class="settings-note" id="settingsNote">せっていして、はじめて ください。</span>
      </div>
    </section>

    <div class="cardwrap">
      <section class="flashcard" id="flashcard" aria-live="polite">
        <div class="groupbadge" id="groupBadge"></div>
        <div class="formbadge" id="formBadge"></div>
        <div class="target" id="targetText"></div>
        <div class="word" id="wordText"></div>
        <div class="arrow">↓</div>
        <div class="answer hiddenAnswer" id="answerText"></div>
        <div class="hint" id="hintText"></div>
      </section>

      <div class="actions">
        <button class="bigbtn show" id="showBtn">こたえを みる</button>
        <button class="bigbtn next" id="nextBtn">つぎへ</button>
        <button class="bigbtn again personal-only" id="againBtn" hidden disabled>もういちど</button>
        <button class="bigbtn ok personal-only" id="okBtn" hidden disabled>できた</button>
      </div>
      <div class="footerrow">
        <div class="toggleline">
          <label><input type="checkbox" id="shuffleCheck" checked> ランダム</label>
          <label class="personal-only" hidden><input type="checkbox" id="repeatMistakes" checked> 「もういちど」を また だす</label>
        </div>
        <button class="smallbtn" id="resetBtn">さいしょから</button>
      </div>
    </div>
    <p class="keyboard-help">スペース：こたえを みる　／　→：つぎへ</p>
  </div>

  <div id="rulesPage" hidden>
    <section class="panel" aria-label="ルールの しゅるい">
      <p class="label">1　ことばの しゅるい</p>
      <div class="tabs" id="ruleTypeTabs"></div>
    </section>
    <section class="panel" aria-label="ルールを えらぶ">
      <p class="label" id="ruleFamilyLabel">2　ルールを えらぶ</p>
      <div class="chips" id="ruleFamilyChips"></div>
    </section>
    <section class="panel" id="rulePatternPanel">
      <p class="label" id="rulePatternLabel">3　へんかを えらぶ</p>
      <div class="chips" id="rulePatternChips"></div>
    </section>

    <section class="rule-stage" aria-labelledby="ruleTitle">
      <div class="rule-heading">
        <h2 id="ruleTitle"></h2>
        <span class="rule-exception" id="ruleException" hidden>とくべつ</span>
      </div>
      <p id="ruleIntro" class="rule-intro"></p>
      <div id="familyNote" class="family-note" hidden></div>
      <div class="rule-steps" id="ruleSteps"></div>
      <div class="rule-summary" id="ruleSummary" aria-live="polite"></div>
      <div class="rule-controls">
        <button class="smallbtn" id="ruleRestartBtn">はじめから みる</button>
        <span class="step-count" id="ruleStepCount"></span>
        <button class="bigbtn next" id="ruleStepBtn">つぎを みる</button>
      </div>
      <p class="rule-help">じゅんばんに みて、くらべましょう。</p>
    </section>
  </div>
</div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
